<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
{%- assign is_home = false -%}
{%- if page.url == "/" or page.url == "/index.html" -%}{%- assign is_home = true -%}{%- endif -%}
<title>{% if is_home %}OMNI — 게임부터 급식까지, 슬래시 하나로{% else %}{{ page.title | default: "OMNI" }} · OMNI{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="OMNI">
<meta property="og:title" content="{% if is_home %}OMNI — 게임부터 급식까지, 슬래시 하나로{% else %}{{ page.title | default: 'OMNI' }} · OMNI{% endif %}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
