<meta charset="utf-8">
<meta name="theme-color" content="#0757ff">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
{%- assign is_home = false -%}
{%- if page.url == "/" or page.url == "/index.html" -%}{%- assign is_home = true -%}{%- endif -%}
<title>{% if is_home %}OMNI — 게임부터 급식까지, 슬래시 하나로{% else %}{{ page.title | default: "OMNI" }} · OMNI{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="OMNI">
<meta property="og:title" content="{% if is_home %}OMNI — 게임부터 급식까지, 슬래시 하나로{% else %}{{ page.title | default: 'OMNI' }} · OMNI{% endif %}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
<link rel="preload" href="{{ '/assets/fonts/PretendardVariable.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
